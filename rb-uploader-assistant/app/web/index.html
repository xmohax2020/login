<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>rb-uploader-assistant</title>
  <style>
    body { font-family: Tahoma, Arial, sans-serif; margin: 24px; background: #fafafa; }
    h1 { margin-bottom: 8px; }
    .bar { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
    input, select, textarea, button { padding: 8px; border-radius: 8px; border: 1px solid #ccc; }
    button { cursor: pointer; }
    table { width: 100%; border-collapse: collapse; background: white; }
    th, td { border: 1px solid #e6e6e6; padding: 8px; text-align: right; }
    th { background: #f0f0f0; }
    .panel { margin-top: 18px; background: white; border: 1px solid #e6e6e6; border-radius: 10px; padding: 12px; }
    .muted { color: #666; font-size: 13px; }
  </style>
</head>
<body>
  <h1>rb-uploader-assistant</h1>
  <div class="muted">لوحة إدارة تجهيز تصاميم Redbubble (نسخة MVP مطورة)</div>

  <div class="bar">
    <label>تصفية الحالة:</label>
    <select id="status-filter">
      <option value="">الكل</option>
      <option value="draft">draft</option>
      <option value="ready">ready</option>
      <option value="uploaded">uploaded</option>
      <option value="published">published</option>
      <option value="duplicate">duplicate</option>
    </select>
    <button id="refresh-btn">تحديث</button>
  </div>

  <table id="designs-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Slug</th>
        <th>Title</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div class="panel">
    <h3>تعديل Metadata</h3>
    <div class="bar">
      <input id="design-id" type="number" placeholder="Design ID" />
      <input id="title" type="text" placeholder="Title (20-80)" style="min-width:320px" />
    </div>
    <div class="bar">
      <textarea id="description" placeholder="Description" rows="3" style="width:100%"></textarea>
    </div>
    <div class="bar">
      <input id="tags" type="text" placeholder="tag1,tag2,tag3,..." style="width:100%" />
    </div>
    <div class="bar">
      <button id="save-meta-btn">حفظ Metadata</button>
      <button id="regen-meta-btn">إعادة توليد Metadata</button>
      <input id="regen-niche" type="text" value="general" placeholder="niche" />
    </div>
  </div>

  <div class="panel">
    <h3>آخر السجلات</h3>
    <button id="load-logs-btn">تحميل السجلات</button>
    <pre id="logs" style="white-space:pre-wrap;background:#f7f7f7;padding:10px;border-radius:8px"></pre>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
